name: Course validation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: course-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-validation:
    name: Linux validation (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - name: Check out course
        uses: actions/checkout@v5

      - name: Record runner baseline
        run: |
          uname -a
          cat /etc/os-release
          dpkg --print-architecture

      - name: Install documented prerequisites
        run: |
          sudo apt-get update
          xargs sudo apt-get install -y < deploy/ubuntu-packages.txt

      - name: Permit unshare in this disposable runner when required
        run: |
          if ! unshare --user --map-root-user true 2>/dev/null; then
            sudo install -m 0644 validation/apparmor-north-echo-unshare \
              /etc/apparmor.d/north-echo-unshare
            sudo apparmor_parser -r /etc/apparmor.d/north-echo-unshare
          fi
          unshare --user --map-root-user true

      - name: Run automated tests
        run: python3 scripts/run_tests.py --require-no-skips

      - name: Compile canonical Landlock lesson
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 \
            course/module-05-filesystem-landlock/lesson-03/landlock_launch.c \
            -o "$RUNNER_TEMP/north-echo-landlock-launch"

      - name: Verify canonical course integrity
        run: ./scripts/attest-course

      - name: Verify manual sources and assembled manual
        run: python3 scripts/build_field_manual.py --check

      - name: Run Linux preflight
        run: ./scripts/linux-preflight

      - name: Require an empty managed runtime
        run: |
          test -z "$(find .student .fixtures .runtime -mindepth 1 ! -name .gitkeep -print)"
